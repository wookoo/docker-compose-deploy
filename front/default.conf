server {
    listen 80;
    listen [::]:80;
    server_name 도메인;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 도메인;

    ssl_certificate /etc/letsencrypt/live/도메인/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/도메인/privkey.pem;

    root /html;
    index index.html;

     location / {
        try_files $uri $uri/ /index.html;
    }


    location /api {
        proxy_pass http://backend:8080;
    }
}