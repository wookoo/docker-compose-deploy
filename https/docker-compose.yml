version: '3'
services:
  nginx:
    image: nginx:latest

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ../front/data/certbot/conf:/etc/letsencrypt
      - ../front/data/certbot/www:/var/www/certbot
    ports:
      - 80:80
      - 443:443
  certbot:
    image: certbot/certbot
    volumes:
      - ../front/data/certbot/conf:/etc/letsencrypt
      - ../front/data/certbot/www:/var/www/certbot